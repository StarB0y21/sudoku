<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style/main.css">
</head>

<body>
    <div id="container">
        <div id="game-status">
            <p id="wrong-titile">Wrong:</p>
            <span id="wrong-number">0</span>
        </div>
        <div id="game-board"></div>
        <div id="numbers">
            <p id="number-item-title">selected number: <span>Nothing</span></p>
            <div class="tools" id="number1">1</div>
            <div class="tools" id="number2">2</div>
            <div class="tools" id="number3">3</div>
            <div class="tools" id="number4">4</div>
            <div class="tools" id="number5">5</div>
            <div class="tools" id="number6">6</div>
            <div class="tools" id="number7">7</div>
            <div class="tools" id="number8">8</div>
            <div class="tools" id="number9">9</div>
        </div>
        <div id="tools">
            <p id="tool-item-title">selected tool: <span id="selected-tool">Nothing</span></p>
            <div class="tools" id="eraser">
                <img src="img/eraser.png" alt="">
            </div>
            <div class="tools" id="pen">
                <img src="img/pencil.png" alt="">
            </div>
        </div>
        <!-- <div id="game-tools">
        </div> -->
    </div>
</body>

</html>
